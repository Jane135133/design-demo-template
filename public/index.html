<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交互方案演示 · 通用模板</title><link rel="stylesheet" href="style.css"></head><body>
<header class="workspace-header"><a class="wordmark" href="#" aria-label="演示首页"><span class="brand-symbol">D</span><img id="brand-logo" hidden alt="项目标志"><strong id="brand-name"></strong><span id="brand-context"></span></a><div class="header-right"><span class="draft-label"><i></i>交互演示</span><button id="guide-toggle" aria-expanded="false" aria-controls="guide-panel">讲解提示 <span id="guide-count"></span></button><button id="presentation">沉浸体验 ↗</button></div></header>
<main class="workspace"><aside class="control-panel"><div id="eyebrow" class="eyebrow"></div><h1 id="project-title"></h1><div id="options"></div><button id="reset" class="reset-button">↻　查看设计推荐方案</button></aside><section class="stage" aria-label="方案演示展示区"><div id="stage-title" class="stage-label" aria-live="polite"></div><div class="phone-shell"><div id="phone" class="phone"><div class="statusbar"><b>9:41</b><div class="island"></div><span>▰</span></div><div id="demo-root"></div><div class="home-indicator"></div></div></div><div class="stage-note">LIVE PREVIEW　 /　交互方案实时预览</div></section></main>
<aside id="guide-panel" class="guide-panel" hidden aria-label="讲解提示"><div class="guide-panel-head"><div><span>演示备忘</span><h2>讲解提示</h2></div><button id="guide-close" aria-label="关闭讲解提示">×</button></div><div class="guide-summary"><span id="guide-progress"></span><button id="guide-reset">重置勾选</button></div><div id="guide-list"></div><footer>勾选只记录讲解进度</footer></aside><div class="presentation-tools"><button id="guide-floating" aria-expanded="false">讲解提示</button><button id="exit-presentation">退出沉浸体验 ↙</button></div>
<script src="config.js"></script><script src="demo.js"></script><script src="app.js"></script></body></html>
